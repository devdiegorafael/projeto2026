<!DOCTYPE html>

  <title>Div e Span</title>

<body>
  <div class="pagina">
    <header>
      <h1>Div e Span</h1>
    </header>

    <main>
      <div class="conteudo">
        <p>A tag <code>&lt;div&gt;</code> é usada para agrupar blocos de conteúdo.</p>
        <p>A tag <code>&lt;span&gt;</code> é usada para estilizar partes específicas dentro de um texto.</p>

        <div style="background-color:#eee; padding:10px;">
          Este é um exemplo de <strong>DIV</strong>.
        </div>

        <p>Este é um exemplo de <span style="color:red;">SPAN</span> dentro de um texto.</p>
      </div>
