<!DOCTYPE html>

  <title>Parágrafos e Linhas</title>

<body>
  <div class="pagina">
    <header>
      <h1>Parágrafos e Linhas Horizontais</h1>
    </header>

    <main>
      <div class="conteudo">
        <p>Em HTML, os parágrafos são criados com a tag <code>&lt;p&gt;</code>.</p>
        <p>Já a tag <code>&lt;hr&gt;</code> é usada para inserir uma linha horizontal.</p>

        <hr>

        <p>Este é o primeiro parágrafo.</p>
        <p>Este é o segundo parágrafo.</p>
        <hr>
        <p>Este texto aparece depois da linha horizontal.</p>
      </div>

      <a href="index.html" class="botao">Voltar para Home</a>
    </main>
  </div>
