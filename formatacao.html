<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Formatação de Textos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="pagina">
    <header>
      <h1>Formatação de Textos</h1>
    </header>

    <main>
      <div class="conteudo">
        <p>O HTML possui várias tags que permitem <strong>formatar textos</strong> e dar diferentes estilos:</p>

        <ul>
          <li><strong>&lt;strong&gt;</strong> → <strong>negrito</strong></li>
          <li><em>&lt;em&gt;</em> → <em>ênfase (itálico)</em></li>
          <li><u>&lt;u&gt;</u> → <u>sublinhado</u></li>
          <li><strike>&lt;strike&gt;</strike> → <strike>texto riscado</strike></li>
        </ul>

        <hr>

        <p>Exemplo: Este é um <strong>texto em negrito</strong>, com <em>ênfase</em>, <u>sublinhado</u> e até um <strike>erro</strike>.</p>
      </div>

      <a href="index.html" class="botao">Voltar para Home</a>
    </main>
  </div>
</body>
</html>
